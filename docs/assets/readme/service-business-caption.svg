<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">사용자 업무</title>
  <desc id="description">웹·모바일은 같은 core-service를 사용하며, core-service가 catalog-service와 ai-service를 호출합니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">사용자 업무</text>
  <text x="20" y="42" font-size="13">웹·모바일은 같은 core-service를 사용하며,</text>
  <text x="20" y="62" font-size="13">core-service가 catalog-service와 ai-service를 호출합니다.</text>
</svg>
