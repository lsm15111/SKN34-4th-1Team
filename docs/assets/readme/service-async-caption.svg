<svg xmlns="http://www.w3.org/2000/svg" width="820" height="76" viewBox="0 0 820 76" role="img" aria-labelledby="title description">
  <title id="title">비동기 작업</title>
  <desc id="description">큐가 활성화된 업무는 core-service가 작업과 발행 대기 기록(Outbox)을 MySQL에 저장한 뒤 RabbitMQ로 전달합니다. 발행기와 소비자는 모두 core-service 내부에서 실행됩니다.</desc>
  <style>
    text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    .accent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
    }
  </style>
  <rect class="accent" x="0" y="4" width="4" height="64" rx="2" />
  <text x="20" y="20" font-size="15" font-weight="600">비동기 작업</text>
  <text x="20" y="42" font-size="13">큐가 활성화된 업무는 core-service가 작업과 발행 대기 기록(Outbox)을 MySQL에 저장한 뒤</text>
  <text x="20" y="62" font-size="13">RabbitMQ로 전달합니다. 발행기와 소비자는 모두 core-service 내부에서 실행됩니다.</text>
</svg>
